<!doctype html>
<html lang="en">
  <head>
    <!-- Meta -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PN5180 ESP</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="icon-128x128.png">

    <!-- CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/fontawesome.min.css" rel="stylesheet">
    <link href="css/styles.min.css" rel="stylesheet">

    <!-- JavaScript Libraries (non-module) -->
    <script src="js/Bs5Utils.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery.min.js"></script>

    <!-- Module Scripts -->
    <script src="js/settings.js" type="module"></script>
  </head>
  <body>
    <div id="common-navbar"></div>
    <main class="container pt-3">
      <div class="jumbotron">
        <form id="formSettings">

          <h5 class="mb-3">WiFi</h5>
          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="inputSsid" name="ssid" placeholder="SSID">
            <label for="inputSsid">SSID</label>
          </div>
          <div class="input-group mb-4">
            <div class="form-floating">
              <input type="password" class="form-control" id="inputPassword" name="password" placeholder="Password">
              <label for="inputPassword">Password</label>
            </div>
            <span class="input-group-text" id="togglePassword" role="button">
              <i class="fa-solid fa-fw fa-eye" id="togglePasswordIcon"></i>
            </span>
          </div>

          <h5 class="mb-3">Discord</h5>
          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="inputChannelId" name="channel_id" placeholder="Channel ID">
            <label for="inputChannelId">Channel ID</label>
          </div>
          <div class="input-group mb-4">
            <div class="form-floating">
              <input type="password" class="form-control" id="inputToken" name="token" placeholder="Token">
              <label for="inputToken">Token</label>
            </div>
            <span class="input-group-text" id="toggleToken" role="button">
              <i class="fa-solid fa-fw fa-eye" id="toggleTokenIcon"></i>
            </span>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-dark" id="btnSubmit">Save</button>
            <button type="button" class="btn btn-outline-dark" id="btnRestart">Restart</button>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
